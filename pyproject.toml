[project]
name = "tiktoks"
version = "0.1.0"
description = "Code-driven TikTok story, quiz and map posts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "ezesri>=0.3.5",
    "geopandas>=0.14",
    "mapclassify>=2.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "jupyter-black>=0.3",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
tiktoks = "tiktoks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktoks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

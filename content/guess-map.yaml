# Guess-the-map posts, one entry per post.
#
# Each entry names a query instead of shipping a CSV. Rendering fetches the data,
# joins it on ISO 3166-1 alpha-3 through data/reference/country_crosswalk.csv and
# writes the slides to posts/guess-map/<slug>/<theme>/.
#
#   uv run tiktoks catalog --list
#   uv run tiktoks catalog --slug euro-countries
#   uv run tiktoks catalog --all
#
# Wikidata property and value IDs used below:
#   P463 member of        Q7184  NATO
#   P38  currency         Q4916  euro
#   P1622 driving side    Q11920728 left
#   P463 member of        Q7795  OPEC
#
# `expect` fails the render when a query returns the wrong number of countries.
# `include` and `exclude` correct Wikidata where it is wrong or out of date; each
# one carries a comment saying why.

defaults:
  hide_antarctica: true
  # Single hue, light for low and dark for high. See src/tiktoks/palettes.py.
  palette: Blues
  hashtags: [maps, geography, dataviz, guessthemap]

posts:
  - slug: euro-countries
    difficulty: easy
    topic: currency
    map_type: binary
    prompt: What do these countries have in common?
    clue: All of them are in Europe, but not every EU member is shaded.
    answer: They use the euro
    answer_note: Twenty-one of the 27 EU members use the euro, along with several microstates and overseas territories. Bulgaria joined in 2026.
    source: "Source: Wikidata currency property. Boundaries: Natural Earth."
    challenge: Name an EU member that does not use the euro.
    challenge_note: There are six. Most people get two.
    expect:
      min_countries: 35
    fetch:
      kind: wikidata_members
      property: P38
      value: Q4916
      # Wikidata records the Netherlands' currency on the kingdom, not the country.
      include: [NLD]

  - slug: nato-members
    difficulty: easy
    topic: alliances
    map_type: binary
    prompt: What do these countries have in common?
    clue: Look across North America and Europe.
    answer: They are NATO members
    answer_note: NATO has 32 members. Finland joined in 2023 and Sweden in 2024.
    source: "Source: Wikidata membership property. Boundaries: Natural Earth."
    challenge: Name the two newest NATO members.
    expect:
      count: 32
    fetch:
      kind: wikidata_members
      property: P463
      value: Q7184
      # Both record the membership on the kingdom rather than the country.
      include: [DNK, NLD]

  - slug: drives-on-the-left
    difficulty: medium
    topic: transportation
    map_type: binary
    prompt: What do these countries have in common?
    clue: It has more to do with empire than with geography.
    answer: They drive on the left
    answer_note: About a third of the world's population drives on the left. Most of these countries were once British colonies. Japan, Thailand and Indonesia were not.
    source: "Source: Wikidata driving side property. Boundaries: Natural Earth."
    challenge: Name a country that drives on the left and was never a British colony.
    expect:
      min_countries: 70
    fetch:
      kind: wikidata_members
      property: P1622
      value: Q11920728

  - slug: opec-members
    difficulty: hard
    topic: energy
    map_type: binary
    prompt: What do these countries have in common?
    clue: Twelve countries, three continents, one commodity.
    answer: They are OPEC members
    answer_note: OPEC has 12 members and no producer in North America. Angola left in 2024.
    source: "Source: Wikidata membership property. Boundaries: Natural Earth."
    challenge: Name the only OPEC member in South America.
    expect:
      count: 12
    fetch:
      kind: wikidata_members
      property: P463
      value: Q7795
      # Angola left OPEC in January 2024; Wikidata still has no end date on it.
      exclude: [AGO]

  - slug: gdp-per-capita
    difficulty: medium
    topic: economy
    prompt: What does this map measure?
    clue: Darker means more of it. Luxembourg and Switzerland are at the top.
    answer: GDP per capita
    answer_note: The richest and poorest countries differ roughly a hundredfold.
    source: "Source: World Bank, NY.GDP.PCAP.CD. Boundaries: Natural Earth."
    legend_format: "${:,.0f}"
    challenge: Guess which country ranks first. It is smaller than Rhode Island.
    fetch:
      kind: worldbank
      indicator: NY.GDP.PCAP.CD

  - slug: life-expectancy
    difficulty: medium
    topic: health
    prompt: What does this map measure?
    clue: The range runs from the low 50s to the mid 80s.
    answer: Life expectancy at birth
    answer_note: Japan and Switzerland sit near the top, central Africa at the bottom.
    source: "Source: World Bank, SP.DYN.LE00.IN. Boundaries: Natural Earth."
    palette: Purples
    legend_format: "{:,.0f} yrs"
    challenge: Name the country with the highest life expectancy in the Americas.
    fetch:
      kind: worldbank
      indicator: SP.DYN.LE00.IN

  - slug: forest-share
    difficulty: hard
    topic: climate
    prompt: What does this map measure?
    clue: It is not population, and it is not income.
    answer: Share of land covered by forest
    answer_note: Suriname, Guyana and Gabon are more than 80 percent forest.
    source: "Source: World Bank, AG.LND.FRST.ZS. Boundaries: Natural Earth."
    palette: Greens
    legend_format: "{:,.0f}%"
    challenge: Name the most forested country in South America. It is not Brazil.
    fetch:
      kind: worldbank
      indicator: AG.LND.FRST.ZS

  - slug: black-population-share
    difficulty: medium
    topic: demographics
    geography: https://stilesdata.com/gis/usa_counties_demos_generations.geojson
    boundary_overlay: https://stilesdata.com/gis/us_states.geojson
    boundary_color: "#d8d8d8"
    boundary_width: 1.4
    region_bounds: [-125, 24, -66, 50]
    prompt: What does this map measure?
    clue: Darker counties have a larger share of this group.
    answer: Non-Hispanic Black population share
    answer_note: The highest shares cluster across the Black Belt, from eastern Texas to the Atlantic coast.
    source: "Source: Esri demographics, accessed via stilesdata.com."
    palette: Reds
    scheme: FisherJenks
    legend_format: "{:.0%}"
    challenge: Name the state with the largest Black population.
    mystery_alt: An unlabeled map of the contiguous United States, with counties shaded from light to dark red.
    answer_alt: A county map showing the Black share of each county's population, highest across much of the South.
    value:
      numerator: NHSPBLK_CY
      denominator: TOTPOP_CY

  - slug: hispanic-population-share
    difficulty: medium
    topic: demographics
    geography: https://stilesdata.com/gis/usa_counties_demos_generations.geojson
    boundary_overlay: https://stilesdata.com/gis/us_states.geojson
    boundary_color: "#d8d8d8"
    boundary_width: 1.4
    region_bounds: [-125, 24, -66, 50]
    prompt: What does this map measure?
    clue: Darker counties have a larger share of this group.
    answer: Hispanic population share
    answer_note: The highest shares stretch along the Southwest border and through parts of Texas and Florida.
    source: "Source: Esri demographics, accessed via stilesdata.com."
    palette: Greens
    scheme: FisherJenks
    legend_format: "{:.0%}"
    challenge: Name the state with the largest Hispanic population.
    mystery_alt: An unlabeled map of the contiguous United States, with counties shaded from light to dark green.
    answer_alt: A county map showing the Hispanic share of each county's population, highest in the Southwest and South Texas.
    value:
      numerator: HISPPOP_CY
      denominator: TOTPOP_CY

  - slug: average-household-size
    difficulty: hard
    topic: demographics
    geography: https://stilesdata.com/gis/usa_counties_demos_generations.geojson
    boundary_overlay: https://stilesdata.com/gis/us_states.geojson
    boundary_color: "#d8d8d8"
    boundary_width: 1.4
    region_bounds: [-125, 24, -66, 50]
    prompt: What does this map measure?
    clue: Darker counties have more of this.
    answer: Average household size
    answer_note: Household sizes tend to be largest in the Southwest and parts of the South.
    source: "Source: Esri demographics, accessed via stilesdata.com."
    palette: Blues
    legend_format: "{:.1f} people"
    challenge: Which state has the largest average household size?
    mystery_alt: An unlabeled map of the contiguous United States, with counties shaded from light to dark blue.
    answer_alt: A county map showing average household size, highest in parts of the Southwest and South.
    value:
      field: AVGHHSZ_CY

  - slug: population
    difficulty: easy
    topic: demographics
    prompt: What does this map measure?
    clue: The two darkest countries together are home to more than a third of humanity.
    answer: Population
    answer_note: India and China are the world's two most populous countries.
    source: "Source: World Bank, SP.POP.TOTL. Boundaries: Natural Earth."
    palette: Oranges
    scheme: FisherJenks
    legend_format: "{:,.0f}"
    challenge: Name the world's third most populous country.
    fetch:
      kind: worldbank
      indicator: SP.POP.TOTL
      year: 2024

  - slug: in-n-out-locations
    difficulty: easy
    topic: food
    map_kind: points
    geography: https://stilesdata.com/gis/us_states.geojson
    points: https://raw.githubusercontent.com/stiles/locations/refs/heads/main/in-n-out/data/processed/in-n-out_locations.geojson
    region_bounds: [-125, 24, -66, 50]
    point_size: 18
    prompt: What do these dots represent?
    clue: The chain started in California in 1948 and has not reached most of the East.
    answer: In-N-Out Burger locations
    answer_note: Its restaurants remain concentrated in California, Texas and the Southwest.
    source: "Source: In-N-Out Burger locations compiled by Matt Stiles. State boundaries: U.S. Census Bureau."
    challenge: Which state has the most In-N-Out locations?
    mystery_alt: An unlabeled map of the contiguous United States with dots marking store locations.
    answer_alt: A map of In-N-Out Burger locations, concentrated in California, Texas and the Southwest.
